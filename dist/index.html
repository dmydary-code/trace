<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Trace — change routes and inline code review"><title>Trace · Review changes</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="logo" href="./">↳ trace</a><span class="divider"></span><span id="repo">Local repository</span><span class="badge" id="source-badge">LOCAL</span><div class="spacer"></div><button id="theme" title="Toggle theme" aria-label="Switch to light theme">☀</button><button id="review" class="primary">Send to agent <span id="review-count">0</span> ↗</button></header>
<div class="workspace"><aside><div class="sidebar-title">Changed files <span id="file-count"></span></div><input id="search" type="search" placeholder="Find a file…" aria-label="Find a file"><div id="tree"></div><div class="sidebar-bottom"><span id="progress"></span><div class="progress"><i id="progress-bar"></i></div></div></aside>
<main><div class="intro"><div class="eyebrow" id="branch">GIT REVIEW</div><h1 id="title">Review your changes</h1><p>Review the diff, leave line comments, and send a focused task to your agent.</p></div>
<div class="toolbar"><div class="segmented"><button id="files-mode" aria-pressed="true">☷ Files</button><button id="route-mode" aria-pressed="false">↳ Change route</button></div><div class="spacer"></div><span id="detected" class="footnote"></span><button id="refresh" hidden>Refresh diff</button></div>
<div id="route-info" hidden><div class="route-caption"><span>READING ORDER</span><span>Detected from project files and package configuration</span></div><div id="route-links"></div></div><div class="diff-caption"><span id="summary"></span><span>Click <b>+</b> beside a line to leave feedback</span></div><div id="feed"></div><div class="endmark">End of changes</div></main></div>
<dialog id="handoff"><div class="dialog-head"><div><small>REVIEW</small><h2>Request changes</h2></div><button id="close-dialog" aria-label="Close">×</button></div><p id="agent-info"></p><div id="review-list"></div><label for="instruction">Additional instructions</label><textarea id="instruction" placeholder="Describe the changes you want the agent to make"></textarea><div id="job-state" role="status"></div><div class="dialog-actions"><button id="copy-prompt">Copy task</button><button id="download">Download JSON</button><button id="cancel-review" hidden>Cancel review</button><button id="approve" hidden>Finish without changes</button><button id="send" class="primary" hidden>Send to agent ↗</button></div><p class="footnote" id="handoff-help"></p></dialog><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
